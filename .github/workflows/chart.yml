name: chart
on:
  push:
    paths: ['charts/**', '.github/workflows/chart.yml']
  pull_request:
    paths: ['charts/**']

jobs:
  lint-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: helm lint
        run: |
          for env in dev prod; do
            helm lint charts/ledger -f charts/ledger/values-$env.yaml --strict
          done
      - name: helm template
        run: |
          for env in dev prod; do
            helm template ledger charts/ledger -f charts/ledger/values-$env.yaml > /dev/null
          done
      - name: trivy config (Kubernetes misconfigurations)
        # Fails on HIGH/CRITICAL, e.g. a container that can run as root or write its root filesystem.
        run: docker run --rm -v "$PWD/charts:/charts:ro" aquasec/trivy:0.69.1 config --severity HIGH,CRITICAL --exit-code 1 /charts/ledger
