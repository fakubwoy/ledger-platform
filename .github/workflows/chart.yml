name: chart
on:
  push:
    paths: ['charts/**', '.github/workflows/chart.yml']
  pull_request:
    paths: ['charts/**']

jobs:
  lint-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: helm lint
        run: |
          for env in dev prod; do
            helm lint charts/ledger -f charts/ledger/values-$env.yaml --strict
          done
      - name: helm template
        run: |
          for env in dev prod; do
            helm template ledger charts/ledger -f charts/ledger/values-$env.yaml > /dev/null
          done
