kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ledger
nodes:
  - role: control-plane
    # ingress-nginx (kind flavour) runs on the node with this label and binds hostPort 80 there.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - {containerPort: 80, hostPort: 8080, protocol: TCP}
  - role: worker
  - role: worker
