# External Secrets Operator reads the DB password from Secret Manager with Workload Identity (no key files)
# and writes the `ledger-db` Secret the chart expects. Install ESO first, and annotate its ServiceAccount
# (external-secrets/external-secrets) with iam.gke.io/gcp-service-account = <external_secrets_gsa>.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: "<your GCP project>"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ledger-db
  namespace: ledger
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: ledger-db
    template:
      type: kubernetes.io/basic-auth
      data:
        username: ledger
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: ledger-db-password
