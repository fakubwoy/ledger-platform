# External Secrets Operator reads the DB password from Key Vault with Workload Identity (no stored credentials)
# and writes the `ledger-db` Secret the chart expects. Install ESO first, and annotate its ServiceAccount
# (external-secrets/external-secrets) with azure.workload.identity/client-id = <external_secrets_client_id>.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "<key_vault_url from terraform output>"
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ledger-db
  namespace: ledger
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: ledger-db
    template:
      type: kubernetes.io/basic-auth
      data:
        username: ledger
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: ledger-db-password
