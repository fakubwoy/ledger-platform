replicaCount: 2

image:
  repository: ledger-service
  tag: dev
  pullPolicy: IfNotPresent

service:
  port: 80

resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {memory: 1Gi}   # the tracing agent adds ~100-150Mi on top of the heap

probes:
  startup: {periodSeconds: 5, failureThreshold: 30}
  liveness: {periodSeconds: 10, failureThreshold: 3}
  readiness: {periodSeconds: 5, failureThreshold: 3}

db:
  # Empty: the chart creates a basic-auth Secret from `password`. Set it to use a Secret you manage
  # (External Secrets, sealed-secrets, a cloud secret store); it needs `username` and `password` keys.
  existingSecret: ""
  username: ledger
  password: ledger
  name: ledger

postgres:
  enabled: true
  instances: 1
  storageSize: 1Gi
  image: ghcr.io/cloudnative-pg/postgresql:17

kafka:
  enabled: true
  version: 4.3.1
  replicas: 1
  storageSize: 2Gi
  replicationFactor: 1
  minIsr: 1

ingress:
  enabled: true
  className: nginx
  host: ""        # empty matches any host, so http://localhost works

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50   # of the CPU *request*, averaged over Pods

# Zero-downtime rollout settings.
rollout:
  maxSurge: 1
  maxUnavailable: 0        # never drop below the desired count: new Pod must be Ready before an old one goes
  preStopSleepSeconds: 10  # lets Service/ingress endpoint removal propagate before SIGTERM
  shutdownTimeout: 25s     # Spring waits this long for in-flight requests
  terminationGracePeriodSeconds: 45   # must exceed preStop + shutdownTimeout, or SIGKILL cuts in-flight work

pdb:
  enabled: true
  minAvailable: 1

tracing:
  enabled: true
  endpoint: http://tempo.monitoring.svc:4317   # OTLP gRPC

# ServiceMonitor, PrometheusRule and dashboard need the kube-prometheus-stack CRDs and sidecar.
monitoring:
  enabled: true
