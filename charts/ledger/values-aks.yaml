# Azure: AKS + Azure Database for PostgreSQL (terraform/aks). Kafka stays in-cluster via Strimzi.
# Fill the two <...> values from `terraform output`.
replicaCount: 3

image:
  repository: ghcr.io/fakubwoy/ledger-service
  tag: "sha-6b6ec48"
  pullPolicy: IfNotPresent

db:
  url: "<db_url from terraform output>"
  # Created by External Secrets from Key Vault (platform/cloud/aks/external-secret.yaml).
  existingSecret: ledger-db
  # B_Standard_B1ms allows 50 connections and reserves 3, so 47 usable. Budget (maxReplicas + maxSurge) x poolSize:
  # (8 + 1) x 5 = 45.
  poolSize: 5

postgres:
  enabled: false   # managed Postgres instead of CloudNativePG

kafka:
  replicas: 3
  storageSize: 20Gi
  replicationFactor: 3
  minIsr: 2

autoscaling:
  minReplicas: 3
  maxReplicas: 8

pdb:
  minAvailable: 2

# kube-prometheus-stack, Loki and Tempo are not installed there. Azure Managed Prometheus scrapes with its own
# PodMonitor CRDs, and traces would go to Application Insights through an OpenTelemetry Collector.
monitoring:
  enabled: false
tracing:
  enabled: false
