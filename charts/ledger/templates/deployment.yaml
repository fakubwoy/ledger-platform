apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "ledger.labels" . | nindent 4 }}
spec:
  {{- /* With an HPA the HPA owns the count; setting it here would reset it on every helm upgrade. */}}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollout.maxSurge }}
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
  template:
    metadata:
      labels: {{- include "ledger.labels" . | nindent 8 }}
      annotations:
        # Env from a ConfigMap is only read at start, so a config change must roll the Pods.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.rollout.terminationGracePeriodSeconds }}
      serviceAccountName: {{ .Release.Name }}
      # The app never calls the Kubernetes API, so it gets no token at all.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001    # the `app` user baked into the image
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ledger
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "ledger.dbSecret" . }}, key: password}
            {{- if .Values.tracing.enabled }}
            # Overrides the image's JAVA_TOOL_OPTIONS (same heap setting) and attaches the OpenTelemetry agent.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -javaagent:/app/opentelemetry-javaagent.jar"
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME)"
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # The only writable path: Tomcat's work dir and JVM perf data live in java.io.tmpdir.
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.rollout.preStopSleepSeconds }}"]
          resources: {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
