apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "ledger.labels" . | nindent 4 }}
spec:
  {{- /* With an HPA the HPA owns the count; setting it here would reset it on every helm upgrade. */}}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "ledger.labels" . | nindent 8 }}
      annotations:
        # Env from a ConfigMap is only read at start, so a config change must roll the Pods.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: ledger
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "ledger.dbSecret" . }}, key: password}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
