apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels: {{- include "ledger.labels" . | nindent 4 }}
data:
  DB_URL: jdbc:postgresql://{{ .Release.Name }}-db-rw:5432/{{ .Values.db.name }}
  DB_USER: {{ .Values.db.username }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Release.Name }}-kafka-bootstrap:9092
