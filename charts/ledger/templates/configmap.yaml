apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels: {{- include "ledger.labels" . | nindent 4 }}
data:
  DB_URL: {{ .Values.db.url | default (printf "jdbc:postgresql://%s-db-rw:5432/%s" .Release.Name .Values.db.name) }}
  DB_USER: {{ .Values.db.username }}
  {{- with .Values.db.poolSize }}
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: {{ . | quote }}
  {{- end }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Release.Name }}-kafka-bootstrap:9092
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: {{ .Values.rollout.shutdownTimeout }}
{{- if .Values.tracing.enabled }}
  OTEL_SERVICE_NAME: ledger-service
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.tracing.endpoint }}
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  # The outbox poller runs every 500 ms; its empty polls would otherwise bury the real traces.
  OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED: "false"
{{- end }}
