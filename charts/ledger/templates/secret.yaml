{{- if not .Values.db.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ledger.dbSecret" . }}
  labels: {{- include "ledger.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.db.username }}
  password: {{ .Values.db.password | quote }}
{{- end }}
