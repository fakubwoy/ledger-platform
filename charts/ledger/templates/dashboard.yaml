{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
    grafana_dashboard: "1"   # the Grafana sidecar loads every ConfigMap with this label
data:
  ledger.json: |-
    {{- .Files.Get "dashboards/ledger.json" | nindent 4 }}
{{- end }}
