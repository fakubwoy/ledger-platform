apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: ledger
spec:
  replicas: 2
  selector:
    matchLabels: {app: ledger}
  template:
    metadata:
      labels: {app: ledger}
    spec:
      containers:
        - name: ledger
          image: ledger-service:dev
          # The image only exists inside the kind nodes (kind load), so never try to pull it.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: ledger-config}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: ledger-db, key: password}
          # Heap is 75% of the memory limit (JAVA_TOOL_OPTIONS in the image), so 768Mi gives ~576Mi heap.
          # Requests drive scheduling and HPA; the memory limit is a hard OOM-kill line. No CPU limit is a
          # deliberate choice here: CPU limits throttle the JVM, and HPA only needs the request.
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 768Mi}
          # Startup: gives the JVM + Flyway up to 30 x 5s = 150s. Liveness/readiness are paused until it passes.
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            periodSeconds: 5
            failureThreshold: 30
          # Liveness: "is the process wedged?" Failure restarts the container. Must not depend on Postgres or Kafka.
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: "should I get traffic?" Failure removes the Pod from Service endpoints, no restart.
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: ledger
spec:
  selector: {app: ledger}
  ports:
    - port: 80
      targetPort: 8080
