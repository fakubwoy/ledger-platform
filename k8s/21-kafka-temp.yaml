# TEMPORARY: single-node KRaft Kafka, no volume. The app's statement consumer fails startup if the
# `kafka` hostname does not resolve, so milestone 1 needs something behind that name.
# Milestone 3 replaces it with Strimzi and persistent storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: ledger
spec:
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      # A Service called "kafka" would inject KAFKA_PORT=tcp://... env vars, which this image
      # would read as broker config. Turn the legacy service env vars off.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 9092
          env:
            # Setting any KAFKA_* var makes the image skip its default config, so spell out all of KRaft.
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ledger
spec:
  selector: {app: kafka}
  ports:
    - port: 9092
