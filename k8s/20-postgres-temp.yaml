# TEMPORARY: throwaway Postgres (no volume, data dies with the pod) so the app can boot in milestone 1.
# Milestone 3 replaces it with a real, persistent setup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ledger
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - {name: POSTGRES_DB, value: ledger}
            - {name: POSTGRES_USER, value: ledger}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: ledger-db, key: DB_PASSWORD}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ledger
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
