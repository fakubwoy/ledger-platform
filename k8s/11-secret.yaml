# Dev only. A Secret is base64, not encryption, so a real repo would never commit this file.
# basic-auth type because CloudNativePG reads username/password from it to create the database owner;
# the ledger Deployment reads the same Secret, so there is one source of truth for the password.
apiVersion: v1
kind: Secret
metadata:
  name: ledger-db
  namespace: ledger
type: kubernetes.io/basic-auth
stringData:
  username: ledger
  password: ledger
